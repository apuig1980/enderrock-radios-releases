# Crea una Release de GitHub cada vez que cambia version.json y le adjunta el paquete de actualización.
# El paquete solo contiene la aplicación, nunca datos: el instalador con la base de datos no se publica aquí.
name: Publicar release

on:
  push:
    branches: [main]
    paths: [version.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer version.json
        id: v
        run: |
          echo "version=$(jq -r .version version.json)" >> "$GITHUB_OUTPUT"
          echo "zip=$(jq -r .actualizacion version.json)" >> "$GITHUB_OUTPUT"
          jq -r .notas version.json > notas.md

      - name: Preparar ficheros
        run: |
          mkdir -p salida
          cp "${{ steps.v.outputs.zip }}" salida/EnderrockRadios-mac-arm64-actualizacion.zip
          (cd salida && sha256sum * > SHA256SUMS.txt)

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" salida/* --clobber
          else
            gh release create "v$V" salida/* --title "Enderrock Ràdios $V" --notes-file notas.md --latest
          fi
